name: offline-validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,codex]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: python -m build
      - run: python -m prestige --help
      - run: python -m prestige --home ./private/ci doctor
      - run: python -m prestige --home ./private/ci benchmark run --suite benchmarks/synthetic/suite.json --output ./private/results.json
      - run: git diff --check
