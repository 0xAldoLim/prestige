[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "prestige-ctf"
version = "0.1.0"
description = "Experimental, evidence-driven offline CTF investigation orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
codex = ["openai-codex==0.163.0"]
openai = ["httpx>=0.27,<1"]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<0.18", "build>=1,<2", "mcp>=2,<3", "httpx>=0.27,<1"]

[project.scripts]
prestige = "prestige.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prestige = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["container: opt-in Docker isolation checks", "live: opt-in paid provider evaluation", "ghidra: opt-in Ghidra headless analysis (slow)", "slow: tests that take more than a few seconds"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
